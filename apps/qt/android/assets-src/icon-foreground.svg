<!-- Adaptive icon foreground, 108x108 dp; artwork stays inside the 66 dp safe zone.
     A red timer ring around a blue "S": word and colour disagree, the Stroop effect in one glyph. -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- ring: faint full track plus a ~300° arc starting at 12 o'clock, like the in-game timer -->
  <circle cx="54" cy="54" r="27" fill="none" stroke="#e74c3c" stroke-opacity="0.18" stroke-width="5.5"/>
  <path d="M54 27 A27 27 0 1 1 30.62 40.5" fill="none" stroke="#e74c3c" stroke-width="5.5" stroke-linecap="round"/>
  <text x="54" y="67" text-anchor="middle" font-family="Roboto, DejaVu Sans, sans-serif"
        font-size="38" font-weight="bold" fill="#3498db">S</text>
</svg>
